<style>
/* 作業場レイアウト：上にファイル操作、左に道具と部品箱、中央に方眼紙、右に選んだ部品の設定 */
:root{
  --bg:#e8ecf0; --panel:#f7f9fb; --line:#d2d9e0; --fg:#1d2733; --muted:#5b6876;
  --accent:#0b6e99; --on-accent:#ffffff; --accent-soft:#d9ebf3; --hover:#e5eaef; --mark:#f0a800;
  --paper:#ffffff; --paper-ink:#5b6876; --sel:#0b6e99;
  --ui:'BIZ UDPGothic','Meiryo','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13171c; --panel:#1b2127; --line:#2e3741; --fg:#e1e6eb; --muted:#93a0ad;
  --accent:#5db8de; --on-accent:#0a1a22; --accent-soft:#163646; --hover:#242c34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13171c; --panel:#1b2127; --line:#2e3741; --fg:#e1e6eb; --muted:#93a0ad;
  --accent:#5db8de; --on-accent:#0a1a22; --accent-soft:#163646; --hover:#242c34; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:13px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:8px}
.brand b{font-size:16px;letter-spacing:.04em}
.brand span{color:var(--muted);font-size:11px}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.grow{flex:1}
.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.warn{border-color:#e03131;color:#e03131}
.btn svg{width:15px;height:15px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:4px 6px;border-radius:6px}
.chk:hover{background:var(--hover)}
.zoom{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.main{display:grid;grid-template-columns:224px minmax(0,1fr) 244px;min-height:0}
.side{background:var(--panel);overflow:auto;min-height:0;padding:12px 14px;display:flex;flex-direction:column;gap:16px}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.sec h3{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:0 0 7px;font-weight:700}
.left #lib{display:flex;flex-direction:column;gap:16px}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tool{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.tool svg{width:18px;height:18px}
.tool:hover{background:var(--hover)}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tool.on::after{content:"";position:absolute;left:7px;right:7px;bottom:3px;height:2px;border-radius:1px;background:var(--mark)}
.lib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.part{border:1px solid transparent;border-radius:6px;background:none;color:var(--fg);font:inherit;font-size:10.5px;padding:3px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:grab;min-width:0}
.part:hover{border-color:var(--line);background:var(--hover)}
.part svg{width:100%;height:42px;background:var(--paper);border-radius:4px;border:1px solid var(--line)}
.part span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stage{position:relative;min-width:0;min-height:0;background:var(--paper);overflow:hidden}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.stage.panning #cv{cursor:grab}
.stage.draw #cv{cursor:crosshair}
.hint{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--paper-ink);background:rgba(255,255,255,.92);border:1px solid #e3e8ed;padding:4px 8px;border-radius:4px;pointer-events:none;max-width:calc(100% - 20px)}
#editor{position:absolute;z-index:5;font-family:var(--ui);border:2px solid var(--sel);border-radius:4px;background:#fff;color:#1d2733;padding:4px 6px;resize:none;line-height:1.25;box-shadow:0 4px 14px rgba(0,0,0,.15);text-align:center}
.props{display:flex;flex-direction:column;gap:14px}
.props h2{font-size:14px;margin:0;display:flex;justify-content:space-between;align-items:baseline}
.props h2 small{font-weight:400;color:var(--muted);font-size:11px}
.f{display:flex;flex-direction:column;gap:6px}
.f > label,.f > .lb{font-size:11px;color:var(--muted);letter-spacing:.04em}
.sws{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.sw.none{background:linear-gradient(135deg,transparent 45%,#e03131 45%,#e03131 55%,transparent 55%),#fff}
.sws input[type=color]{width:26px;height:24px;border:1px solid var(--line);border-radius:5px;padding:0;background:none;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:12px;border:0;background:var(--panel);color:var(--fg);padding:5px 0;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.props textarea,.props input[type=number],.props select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.props textarea{min-height:58px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1;min-width:0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .btn{justify-content:center}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px;line-height:1.5}
kbd{font-family:var(--ui);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--bg);color:var(--fg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.modal{position:fixed;inset:0;background:rgba(10,15,20,.5);display:grid;place-items:center;z-index:40;padding:16px}
.dlg{background:var(--panel);color:var(--fg);border-radius:10px;padding:18px;width:min(720px,100%);max-height:calc(100% - 32px);overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.dlg h2{margin:0;font-size:16px}
.dlg p{margin:0;color:var(--muted);line-height:1.6}
.dlg .pv{background:repeating-conic-gradient(#eef1f4 0 25%,#fff 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:6px;padding:10px;text-align:center}
.dlg .pv img{max-height:46vh;max-width:100%;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.dlg textarea{font:12px/1.4 ui-monospace,Consolas,monospace;width:100%;min-height:200px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
.dlg .row{flex-wrap:wrap;justify-content:flex-end}
.paper{position:relative;background:#fff;margin:0 auto;box-shadow:0 1px 8px rgba(0,0,0,.25);overflow:hidden;max-width:100%}
.paper img{position:absolute;display:block}
.popts{display:flex;flex-wrap:wrap;gap:12px 16px}
.popts > .f{flex:0 0 auto}
.popts .seg button{flex:0 0 auto;padding:5px 12px;white-space:nowrap}
.dlg .row > *{flex:0 0 auto}
@media (max-width:860px){
  body{overflow:auto;height:auto}
  .app{height:auto}
  .main{grid-template-columns:minmax(0,1fr);gap:12px;padding:12px 16px 24px}
  .stage{order:1;height:62vh;border:1px solid var(--line);border-radius:8px}
  .left{order:2}.right{order:3}
  .side{border:1px solid var(--line);border-radius:8px;overflow:visible}
  .lib{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><b>ポンチ絵工房</b><span>製造現場の説明図をすばやく</span></div>
    <button class="btn" id="bNew" title="新しい図">新規</button>
    <button class="btn" id="bOpen" title="保存した図や写真を開く">開く</button>
    <button class="btn" id="bSave" title="図をファイルに保存">保存</button>
    <button class="btn" id="bPhoto" title="写真を下絵として置く">写真を置く</button>
    <input type="file" id="fileIn" accept=".json,.ponchi,image/*" hidden>
    <input type="file" id="photoIn" accept="image/*" hidden>

    <button class="btn" id="bRedo" title="やり直し (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>進む</button>
    <span class="sep"></span>

 <button class="btn" id="bPrint" title="印刷 (Ctrl+P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>印刷</button>
    <button class="btn" id="bCopyImg" title="画像としてコピー（Excel・PowerPointに貼り付け）">画像をコピー</button>
    <button class="btn primary" id="bExport">書き出し</button>
  </header>
  <div class="main">
    <aside class="side left">
      <div class="sec"><h3>道具</h3><div class="tools" id="tools"></div></div>
      <div id="lib"></div>
    </aside>
    <section class="stage" id="stage">
      <svg id="cv" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gMinor" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#eef2f5" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern>
          <pattern id="gMajor" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#gMinor)"/><path d="M50 0H0V50" fill="none" stroke="#d8e0e7" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern>
          <filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>
        </defs>

      </svg>
      <textarea id="editor" hidden></textarea>
      <div class="hint">ダブルクリックで文字入力 ・ ホイールで拡大縮小 ・ スペース＋ドラッグで画面移動</div>

</div>
<div class="modal" id="modal" hidden><div class="dlg" id="dlg"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const svg=$('#cv'), content=$('#content'), overlay=$('#overlay'), grid=$('#grid'), stage=$('#stage'), editor=$('#editor'), props=$('#props');
const GRID=10, GLASS='#eaf1f7', INK='#1f2933';
const ROUGH='<filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>';
const framed=(()=>{try{return window.top!==window}catch(e){return true}})();

function gearPath(cx,cy,ro,ri,n){
  const st=2*Math.PI/n, P=(r,a)=>`${(cx+r*Math.cos(a)).toFixed(1)},${(cy+r*Math.sin(a)).toFixed(1)}`;
  let d='';
  for(let i=0;i<n;i++){const a=i*st;d+=(i?'L':'M')+P(ri,a)+'L'+P(ro,a+st*.15)+'L'+P(ro,a+st*.35)+'L'+P(ri,a+st*.5)}
  return d+'Z';
}
const wheels=(xs,cy,r)=>xs.map(x=>`<circle cx="${x}" cy="${cy}" r="${r}"/><circle cx="${x}" cy="${cy}" r="${r/3}" fill="currentColor"/>`).join('');

/* 部品の形。fn は実寸で描く（伸ばしても線が均一）、svg は既定寸法の箱で描いて拡大縮小する */
const SH={
  rect:{n:'四角',w:120,h:80,fn:(w,h)=>`<rect width="${w}" height="${h}"/>`},
  round:{n:'角丸',w:120,h:80,fn:(w,h)=>`<rect width="${w}" height="${h}" rx="${Math.min(w,h)*.18}"/>`},
  ellipse:{n:'円',w:100,h:100,fn:(w,h)=>`<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2}" ry="${h/2}"/>`},
  tri:{n:'三角',w:100,h:88,ly:.66,fn:(w,h)=>`<polygon points="${w/2},0 ${w},${h} 0,${h}"/>`},
  diamond:{n:'判断',w:120,h:80,fn:(w,h)=>`<polygon points="${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}"/>`},
  arrowblk:{n:'工程矢印',w:130,h:60,fill:'#e9eef3',t:'',fn:(w,h)=>{const a=Math.min(w*.45,h*.8);return `<polygon points="0,${h*.22} ${w-a},${h*.22} ${w-a},0 ${w},${h/2} ${w-a},${h} ${w-a},${h*.78} 0,${h*.78}"/>`}},
  callout:{n:'吹き出し',w:150,h:90,fill:'#fff9db',t:'コメント',ly:.36,fn:(w,h)=>{const b=h*.72;return `<path d="M0,0 H${w} V${b} H${w*.36} L${w*.14},${h} L${w*.2},${b} H0 Z"/>`}},
  cloud:{n:'もやもや',w:150,h:96,vb:[100,100],fill:'#fff0f0',t:'課題',svg:'<path d="M25,85 C5,85 0,60 15,52 C5,35 25,15 40,25 C45,5 75,5 78,25 C95,20 105,45 92,55 C105,70 90,90 72,85 C65,98 35,98 25,85 Z"/>'},
  hole:{n:'穴・中心線',w:100,h:100,fill:'none',t:'',fn:(w,h)=>{const e=Math.min(w,h)*.15+6;return `<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2}" ry="${h/2}"/><path d="M${-e},${h/2} H${w+e} M${w/2},${-e} V${h+e}" fill="none" stroke-width="1" stroke-dasharray="11 3 2 3" stroke-linecap="butt"/>`}},
  num:{n:'番号',w:36,h:36,t:'1',bold:true,size:18,fn:(w,h)=>`<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2}" ry="${h/2}"/>`},

function textEl(x,y,txt,size,color,o={}){
  const lines=String(txt).split('\n'), lh=size*1.25;

  const tr=o.rot?` transform="rotate(${r1(o.rot)} ${r1(x)} ${r1(y)})"`:'';

    lines.map((l,i)=>`<tspan x="${r1(x)}" y="${r1(y0+i*lh)}">${esc(l)||' '}</tspan>`).join('')+'</text>';
}

}

    return `<g data-id="${it.id}"><path class="hit" d="${d}" stroke="transparent" stroke-width="12" fill="none"/><path d="${d}" fill="none" stroke="${it.stroke}" stroke-width="${it.sw}" stroke-linecap="round" stroke-linejoin="round"${dashAttr(it)}/></g>`;

  if(it.type==='text') return `<g data-id="${it.id}" pointer-events="bounding-box">`+textEl(it.x,it.y,it.text,it.size,it.stroke,{v:'top',anchor:'start',bold:it.bold})+'</g>';
  return '';
}

const PT=q=>`${r1(q[0])},${r1(q[1])}`;
/* 文字を線に沿って読みやすい向きで置く（縦の寸法は下から上へ読む） */
function uprightText(x,y,ang,txt,size,color){
  let deg=ang*180/Math.PI; deg=((deg+90)%360+360)%360-90; if(deg>=89.99) deg-=180;
  const a=deg*Math.PI/180;
  return textEl(x+Math.sin(a)*4,y-Math.cos(a)*4,txt,size,color,{v:'bottom',halo:true,rot:deg});
}
function dimGeom(it){
  const dx=it.x2-it.x1, dy=it.y2-it.y1, L=Math.hypot(dx,dy)||1;
  const u=it.mode==='v'?[0,1]:it.mode==='a'?[dx/L,dy/L]:[1,0], n=[-u[1],u[0]];
  const s2=dx*n[0]+dy*n[1];
  return {u,n,s2,d1:[it.x1+n[0]*it.off,it.y1+n[1]*it.off],d2:[it.x2+n[0]*(it.off-s2),it.y2+n[1]*(it.off-s2)],val:Math.abs(dx*u[0]+dy*u[1])};

const dimText=it=>(it.pre||'')+(it.auto?mmOf(dimGeom(it).val):it.text);
function renderDim(it){
  const g=dimGeom(it), {n,d1,d2}=g, c=it.stroke, sw=it.sw, hs=7+sw*2;
  const ext=(px,py,s)=>{const t=it.off-s; if(Math.abs(t)<3) return ''; const k=Math.sign(t);
    return `M${PT([px+n[0]*k*2,py+n[1]*k*2])} L${PT([px+n[0]*(t+k*4),py+n[1]*(t+k*4)])} `};
  const e=ext(it.x1,it.y1,0)+ext(it.x2,it.y2,g.s2);
  const len=Math.hypot(d2[0]-d1[0],d2[1]-d1[1]), a=Math.atan2(d2[1]-d1[1],d2[0]-d1[0]), out=len<hs*2.4;
  const ua=[Math.cos(a),Math.sin(a)];
  const l1=out?[d1[0]-ua[0]*hs*2,d1[1]-ua[1]*hs*2]:d1, l2=out?[d2[0]+ua[0]*hs*2,d2[1]+ua[1]*hs*2]:d2;
  let h=`<g data-id="${it.id}"><path class="hit" d="M${PT(l1)} L${PT(l2)} ${e}" stroke="transparent" stroke-width="12" fill="none"/>`;
  if(e) h+=`<path d="${e}" stroke="${c}" stroke-width="${sw*.8}" fill="none"/>`;
  h+=`<path d="M${PT(l1)} L${PT(l2)}" stroke="${c}" stroke-width="${sw}" fill="none"/>`;
  h+=out?arrowHead(d1[0],d1[1],a,hs,c)+arrowHead(d2[0],d2[1],a+Math.PI,hs,c):arrowHead(d1[0],d1[1],a+Math.PI,hs,c)+arrowHead(d2[0],d2[1],a,hs,c);
  h+=uprightText((d1[0]+d2[0])/2,(d1[1]+d2[1])/2,a,dimText(it),it.size,c);
  return h+'</g>';
}
function angGeom(it){const a1=Math.atan2(it.y1-it.cy,it.x1-it.cx), a2=Math.atan2(it.y2-it.cy,it.x2-it.cx);let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<=-Math.PI)d+=2*Math.PI;return {a1,a2:a1+d,d}}
const angText=it=>it.auto?fmt(Math.abs(angGeom(it).d)*180/Math.PI)+'°':it.text;
function renderAngle(it){
  const {a1,a2,d}=angGeom(it), r=Math.max(8,it.r), c=it.stroke, sw=it.sw, hs=7+sw*2, sg=d>=0?1:-1;
  const P=(a,rr=r)=>PT([it.cx+Math.cos(a)*rr,it.cy+Math.sin(a)*rr]);
  const arc=`M${P(a1)} A${r1(r)},${r1(r)} 0 0 ${d>=0?1:0} ${P(a2)}`;
  let e='';
  for(const [x,y,a] of [[it.x1,it.y1,a1],[it.x2,it.y2,a2]]){const l=Math.hypot(x-it.cx,y-it.cy);if(l<r-2) e+=`M${P(a,l+2)} L${P(a,r+4)} `}
  let h=`<g data-id="${it.id}"><path class="hit" d="${arc} ${e}" stroke="transparent" stroke-width="12" fill="none"/>`;
  if(e) h+=`<path d="${e}" stroke="${c}" stroke-width="${sw*.8}" fill="none"/>`;
  h+=`<path d="${arc}" stroke="${c}" stroke-width="${sw}" fill="none"/>`;
  h+=arrowHead(it.cx+Math.cos(a1)*r,it.cy+Math.sin(a1)*r,a1-sg*Math.PI/2,hs,c)+arrowHead(it.cx+Math.cos(a2)*r,it.cy+Math.sin(a2)*r,a2+sg*Math.PI/2,hs,c);
  const am=a1+d/2, tr=r+it.size*.9;
  h+=textEl(it.cx+Math.cos(am)*tr,it.cy+Math.sin(am)*tr,angText(it),it.size,c,{v:'middle',halo:true});

}
function renderLeader(it){
  const c=it.stroke, sw=it.sw, a=Math.atan2(it.y1-it.y2,it.x1-it.x2), right=it.x2>=it.x1, txt=it.text||'';
  const tw=Math.max(16,...txt.split('\n').map(l=>[...l].reduce((s,ch)=>s+(ch.charCodeAt(0)>255?1:.62),0)*it.size))+6;
  if(it.box){
    /* 枠は矢印と反対側へ伸ばし、線は枠の角につなぐ */
    const n=txt?txt.split('\n').length:1, bw=Math.max(48,tw+10), bh=Math.max(26,n*it.size*1.25+10);
    const bx=right?it.x2:it.x2-bw, by=it.y2<=it.y1?it.y2-bh:it.y2;
    const d=`M${r1(it.x1)},${r1(it.y1)} L${r1(it.x2)},${r1(it.y2)}`;
    let h=`<g data-id="${it.id}"><path class="hit" d="${d}" stroke="transparent" stroke-width="12" fill="none"/>`;
    h+=`<rect x="${r1(bx)}" y="${r1(by)}" width="${r1(bw)}" height="${r1(bh)}" fill="${it.fill||'none'}" stroke="${c}" stroke-width="${sw}" pointer-events="all"/>`;
    h+=`<path d="${d}" stroke="${c}" stroke-width="${sw}" fill="none"/>`+arrowHead(it.x1,it.y1,a,7+sw*2,c);
    if(txt) h+=textEl(bx+bw/2,by+bh/2,txt,it.size,c,{v:'middle'});
    return h+'</g>';
  }
  const sx=it.x2+(right?tw:-tw), d=`M${r1(it.x1)},${r1(it.y1)} L${r1(it.x2)},${r1(it.y2)} H${r1(sx)}`;
  let h=`<g data-id="${it.id}"><path class="hit" d="${d}" stroke="transparent" stroke-width="12" fill="none"/>`;
  h+=`<path d="${d}" stroke="${c}" stroke-width="${sw}" fill="none" stroke-linejoin="round"/>`+arrowHead(it.x1,it.y1,a,7+sw*2,c);
  if(txt) h+=textEl(it.x2+(right?3:-3),it.y2-3,txt,it.size,c,{v:'bottom',anchor:right?'start':'end'});

}
function arcGeom(it){const dx=it.x2-it.x1, dy=it.y2-it.y1, c=Math.hypot(dx,dy)||1, b=it.b||0;
  return {c,b,n:[-dy/c,dx/c],r:Math.abs(b)<.5?0:(c*c/4+b*b)/(2*Math.abs(b)),mx:(it.x1+it.x2)/2,my:(it.y1+it.y2)/2}}
function arcPath(it){const g=arcGeom(it);
  if(!g.r) return `M${r1(it.x1)},${r1(it.y1)} L${r1(it.x2)},${r1(it.y2)}`;
  return `M${r1(it.x1)},${r1(it.y1)} A${r1(g.r)},${r1(g.r)} 0 ${Math.abs(g.b)>g.c/2?1:0} ${g.b>0?0:1} ${r1(it.x2)},${r1(it.y2)}`}
function renderArc(it){const d=arcPath(it);
  return `<g data-id="${it.id}"><path class="hit" d="${d}" stroke="transparent" stroke-width="12" fill="none"/><path d="${d}" fill="none" stroke="${it.stroke}" stroke-width="${it.sw}" stroke-linecap="round"${dashAttr(it)}/></g>`}

function sizeView(){return {W:svg.clientWidth||800,H:svg.clientHeight||600}}
function renderView(){
  const {W,H}=sizeView(), vw=W/view.z, vh=H/view.z;
  svg.setAttribute('viewBox',`${view.x} ${view.y} ${vw} ${vh}`);
  grid.setAttribute('x',view.x-50);grid.setAttribute('y',view.y-50);grid.setAttribute('width',vw+100);grid.setAttribute('height',vh+100);
  $('#zoomLbl').textContent=Math.round(view.z*100)+'%';
}
function render(){
  renderView();
  content.innerHTML=doc.items.map(renderItem).join('');
  renderOverlay();
  queueSave();
}
function renderOverlay(){
  const z=view.z, hs=9/z, items=selItems(); let o='';
  const C='stroke="#0b6e99" fill="none" stroke-width="1.2" vector-effect="non-scaling-stroke"';
  for(const it of items){
    if(isBox(it)){
      const cx=it.x+it.w/2, cy=it.y+it.h/2;
      o+=`<g transform="translate(${cx} ${cy}) rotate(${it.rot||0}) translate(${-it.w/2} ${-it.h/2})"><rect width="${it.w}" height="${it.h}" ${C} stroke-dasharray="4 3"/>`;
      if(items.length===1){
        o+=`<line x1="${it.w/2}" y1="0" x2="${it.w/2}" y2="${-24/z}" ${C}/><circle data-h="rot" cx="${it.w/2}" cy="${-24/z}" r="${hs*.62}" fill="#fff" stroke="#0b6e99" stroke-width="1.5" vector-effect="non-scaling-stroke" style="cursor:grab"/>`;
        for(const hy of [-1,0,1])for(const hx of [-1,0,1]){if(!hx&&!hy)continue;
          const cur=(hx*hy>0)?'nwse':(hx*hy<0)?'nesw':hx?'ew':'ns';
          o+=`<rect data-h="${hx},${hy}" x="${it.w/2*(1+hx)-hs/2}" y="${it.h/2*(1+hy)-hs/2}" width="${hs}" height="${hs}" fill="#fff" stroke="#0b6e99" stroke-width="1.5" vector-effect="non-scaling-stroke" style="cursor:${cur}-resize"/>`}
      }
      o+='</g>';
    }else if(LINEISH.includes(it.type)){
      const H=(k,x,y,sq)=>sq?`<rect data-h="${k}" x="${x-hs/2}" y="${y-hs/2}" width="${hs}" height="${hs}" fill="#fff" stroke="#0b6e99" stroke-width="1.5" vector-effect="non-scaling-stroke" style="cursor:move"/>`:`<circle data-h="${k}" cx="${x}" cy="${y}" r="${hs*.62}" fill="#fff" stroke="#0b6e99" stroke-width="1.5" vector-effect="non-scaling-stroke" style="cursor:move"/>`;
      if(it.type==='line'||it.type==='leader') o+=`<line x1="${it.x1}" y1="${it.y1}" x2="${it.x2}" y2="${it.y2}" ${C} stroke-dasharray="4 3"/>`;
      if(items.length===1){
        for(const k of ['1','2']) o+=H('p'+k,it['x'+k],it['y'+k]);
        if(it.type==='dim'){const g=dimGeom(it);o+=H('off',(g.d1[0]+g.d2[0])/2,(g.d1[1]+g.d2[1])/2,true)}
        if(it.type==='arc'){const g=arcGeom(it);o+=H('pb',g.mx+g.n[0]*g.b,g.my+g.n[1]*g.b,true)}
      }else if(it.type==='dim'||it.type==='arc'){const el=content.querySelector(`[data-id="${it.id}"]`);if(el){const b=el.getBBox();o+=`<rect x="${b.x}" y="${b.y}" width="${b.width}" height="${b.height}" ${C} stroke-dasharray="4 3"/>`}}
    }else{
      const el=content.querySelector(`[data-id="${it.id}"]`); if(!el) continue;
      const b=el.getBBox(), p=4/z;
      o+=`<rect x="${b.x-p}" y="${b.y-p}" width="${b.width+p*2}" height="${b.height+p*2}" ${C} stroke-dasharray="4 3"/>`;
    }
  }
  if(drag&&drag.mode==='band'&&drag.cur){const a=drag.start,b=drag.cur;
    o+=`<rect x="${Math.min(a.x,b.x)}" y="${Math.min(a.y,b.y)}" width="${Math.abs(a.x-b.x)}" height="${Math.abs(a.y-b.y)}" fill="rgba(11,110,153,.08)" stroke="#0b6e99" stroke-width="1" vector-effect="non-scaling-stroke"/>`}

  if(snapMark) o+=`<circle cx="${snapMark.x}" cy="${snapMark.y}" r="${7/z}" fill="rgba(47,158,68,.18)" stroke="#2f9e44" stroke-width="2" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
  overlay.innerHTML=o;
}

/* ---------- 履歴・保存 ---------- */
const snapStr=()=>JSON.stringify(doc.items);
function pushHist(prev){if(prev===snapStr())return;hist.push(prev);if(hist.length>200)hist.shift();fut=[]}
let lastKey='',lastT=0;
function mutate(fn,key){
  const prev=snapStr(); fn();
  const now=Date.now();
  if(!(key&&key===lastKey&&now-lastT<900)) pushHist(prev);
  lastKey=key||'';lastT=now; render();
}
function undo(){pending=null;if(!hist.length)return;fut.push(snapStr());doc.items=JSON.parse(hist.pop());sel=sel.filter(byId);render();renderProps()}
function redo(){pending=null;if(!fut.length)return;hist.push(snapStr());doc.items=JSON.parse(fut.pop());sel=sel.filter(byId);render();renderProps()}
let saveTimer=0;
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem('ponchie-doc',JSON.stringify({items:doc.items,snap:doc.snap,rough:doc.rough,mm:doc.mm}))}catch(e){}},400)}

/* ---------- 座標 ---------- */
function toWorld(e){const r=svg.getBoundingClientRect();return {x:view.x+(e.clientX-r.left)/view.z,y:view.y+(e.clientY-r.top)/view.z}}
const sn=(v,e)=>doc.snap&&!(e&&e.altKey)?Math.round(v/GRID)*GRID:v;
const snP=(p,e)=>({x:sn(p.x,e),y:sn(p.y,e)});
function viewCenter(){const {W,H}=sizeView();return {x:view.x+W/2/view.z,y:view.y+H/2/view.z}}
function zoomAt(f,cx,cy){
  const {W,H}=sizeView(); if(cx==null){cx=W/2;cy=H/2}
  const wx=view.x+cx/view.z, wy=view.y+cy/view.z;
  view.z=Math.min(6,Math.max(.15,view.z*f));
  view.x=wx-cx/view.z; view.y=wy-cy/view.z; renderView(); renderOverlay();
}
function fit(){
  const {W,H}=sizeView(); const b=content.getBBox();
  if(!b.width&&!b.height){view={x:-40,y:-40,z:1};renderView();renderOverlay();return}
  const z=Math.min(W/(b.width+80),H/(b.height+80),2);
  view.z=Math.max(.15,z); view.x=b.x+b.width/2-W/2/view.z; view.y=b.y+b.height/2-H/2/view.z;
  renderView(); renderOverlay();
}

/* ---------- 置く ---------- */
function placeShape(kind,p){
  const d=SH[kind]; let x,y;
  if(p){x=p.x-d.w/2;y=p.y-d.h/2}else{const c=viewCenter();x=c.x-d.w/2+(placeN%6)*20;y=c.y-d.h/2+(placeN%6)*20;placeN++}
  const it=newShape(kind,sn(x),sn(y));
  mutate(()=>doc.items.push(it)); sel=[it.id]; setTool('select'); render(); renderProps();
}
function addImageFile(file,p){
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    const M=1600, s=Math.min(1,M/Math.max(img.width,img.height));
    const cw=Math.round(img.width*s), ch=Math.round(img.height*s);
    const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);
    const src=c.toDataURL('image/jpeg',.85);
    const k=Math.min(1,480/Math.max(cw,ch)), w=cw*k, h=ch*k, ctr=p||viewCenter();
    const it={id:nid(),type:'image',x:sn(ctr.x-w/2),y:sn(ctr.y-h/2),w,h,rot:0,src,op:1};
    mutate(()=>doc.items.unshift(it)); sel=[it.id]; setTool('select'); render(); renderProps();
    toast('写真を一番うしろに置きました。上からなぞって描けます');
  };img.src=fr.result};
  fr.readAsDataURL(file);
}

/* ---------- ポインタ操作 ---------- */
svg.addEventListener('pointerdown',e=>{
  if(editing) commitEdit();
  const p=toWorld(e);
  if(e.button===1||spaceDown||tool==='hand'){
    drag={mode:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};svg.setPointerCapture(e.pointerId);e.preventDefault();return}
  if(e.button!==0) return;
  if(pending){if(pending.chain) chainClick(e); else finishPending();return}
  const prev=snapStr(), h=e.target.closest('[data-h]');
  if(h&&sel.length===1){
    const it=byId(sel[0]), k=h.dataset.h;
    if(k==='rot') drag={mode:'rot',it,prev};
    else if(k==='off') drag={mode:'off',it,prev};
    else if(k==='pb') drag={mode:'pb',it,prev};
    else if((k==='p1'||k==='p2')&&(e.ctrlKey||e.metaKey)&&it.type==='line'){
      const n=k[1], nl=newLine(it['x'+n],it['y'+n],it['x'+n],it['y'+n]);
      Object.assign(nl,{stroke:it.stroke,sw:it.sw,dash:it.dash,a2:it.a2});
      doc.items.push(nl); sel=[nl.id]; drag={mode:'pt',it:nl,k:'2',creating:true,prev};
    }
    else if(k==='p1'||k==='p2') drag={mode:'pt',it,k:k[1],prev};
    else{const [hx,hy]=k.split(',').map(Number), r=(it.rot||0)*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
      const cx=it.x+it.w/2, cy=it.y+it.h/2, ax=-hx*it.w/2, ay=-hy*it.h/2;
      drag={mode:'resize',it,hx,hy,w0:it.w,h0:it.h,c,s,A:{x:cx+ax*c-ay*s,y:cy+ax*s+ay*c},prev}}
  }else if(tool==='select'){
    const g=e.target.closest('#content [data-id]');
    if(g){const id=g.dataset.id;
      if(e.shiftKey){sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id]}
      else if(!sel.includes(id)) sel=[id];
      drag={mode:'move',start:p,orig:JSON.parse(JSON.stringify(selItems())),prev};
    }else{if(!e.shiftKey) sel=[];drag={mode:'band',start:p,base:[...sel],cs:{x:e.clientX,y:e.clientY},prev}}
    renderProps();
  }else if(tool==='rect'||tool==='ellipse'){
    const q=snP(p,e), it=newShape(tool,q.x,q.y); it.w=it.h=1; doc.items.push(it); sel=[it.id];
    drag={mode:'create',it,start:q,prev};
  }else if(tool==='fillet'){
    const c=findCorner(p); snapMark=null;
    if(c) applyCorner(c); else toast('2本の線がつながっている角をクリックしてください');
    return;
  }else if(SNAPTOOLS.includes(tool)){
    const q=nearEnd(p)||snP(p,e); let it, k='2';
    if(tool==='dim') it=newDim(q.x,q.y,q.x,q.y);
    else if(tool==='angle'){it=newAngle(q.x,q.y);k='1'}
    else if(tool==='leader') it=newLeader(q.x,q.y);
    else if(tool==='bleader'){it=newLeader(q.x,q.y);it.box=true}
    else if(tool==='arc') it=newArc(q.x,q.y);
    else{it=newLine(q.x,q.y,q.x,q.y); if(tool==='arrow') it.a2=true; if(tool==='center') Object.assign(it,{dash:'center',sw:1,stroke:INK})}
    doc.items.push(it); sel=[it.id]; drag={mode:'pt',it,k,creating:true,prev,tool};
  }else if(tool==='pen'){
    const it={id:nid(),type:'pen',pts:[[r1(p.x),r1(p.y)]],stroke:style.stroke,sw:style.sw,dash:'solid'};
    doc.items.push(it); sel=[]; drag={mode:'pen',it,prev};
  }else if(tool==='text'){
    const q=snP(p,e), it=newText(q.x,q.y,'');
    doc.items.push(it); sel=[it.id]; setTool('select'); render(); renderProps(); openEditor(it,prev); return;
  }
  svg.setPointerCapture(e.pointerId); render();
});
/* 線の端点への吸着：近くの線の端にぴったりつなぐ */
let snapMark=null;
const SNAPTOOLS=['line','arrow','center','arc','dim','angle','leader','bleader'];
function snapPts(ex){const pts=[];
  for(const it of doc.items){if(it.id===ex) continue;
    if(it.type==='line'||it.type==='arc') pts.push([it.x1,it.y1],[it.x2,it.y2]);
    else if(it.type==='shape'&&!it.rot){const cx=it.x+it.w/2, cy=it.y+it.h/2;
      if(['ellipse','hole','num'].includes(it.kind)) pts.push([cx,cy],[it.x,cy],[it.x+it.w,cy],[cx,it.y],[cx,it.y+it.h]);
      else if(['rect','round'].includes(it.kind)) pts.push([it.x,it.y],[it.x+it.w,it.y],[it.x,it.y+it.h],[it.x+it.w,it.y+it.h]);}}
  return pts;
}
function nearEnd(p,ex){
  const r=12/view.z; let best=null, bd=r;
  for(const q of snapPts(ex)){const d=Math.hypot(q[0]-p.x,q[1]-p.y);if(d<bd){bd=d;best={x:q[0],y:q[1]}}}
  return best;
}
/* 寸法・円弧・角度は「2点を決めてから、位置をマウスで決めてクリック」の2段階 */
function placeDim(it,p,e,lock){
  if(!lock){
    const dx=Math.abs(it.x2-it.x1), dy=Math.abs(it.y2-it.y1), xa=Math.min(it.x1,it.x2), xb=Math.max(it.x1,it.x2), ya=Math.min(it.y1,it.y2), yb=Math.max(it.y1,it.y2);
    const ox=p.x<xa?xa-p.x:p.x>xb?p.x-xb:0, oy=p.y<ya?ya-p.y:p.y>yb?p.y-yb:0;
    it.mode=e.shiftKey?'a':dy<1?'h':dx<1?'v':ox>oy?'v':oy>ox?'h':'a';

function setBulge(it,p,e){
  const g=arcGeom(it); let b=(p.x-g.mx)*g.n[0]+(p.y-g.my)*g.n[1];

function updatePending(e){

    snapMark=ne; it.x2=q.x; it.y2=q.y; setMeasure(it); render(); return}
  if(it.type==='dim') placeDim(it,p,e,false);

/* フィレット・面取り：2本の線がつながる角をクリックして加工する */
const fillet={mode:'R',size:5};
function findCorner(p){
  const tol=14/view.z, ends=[]; let best=null, bd=tol;
  for(const it of doc.items) if(it.type==='line') ends.push([it,'1'],[it,'2']);
  for(let i=0;i<ends.length;i++){const [a,ka]=ends[i], ax=a['x'+ka], ay=a['y'+ka], d=Math.hypot(ax-p.x,ay-p.y);
    if(d>=bd) continue;
    for(let j=0;j<ends.length;j++){const [b,kb]=ends[j]; if(b===a) continue;
      if(Math.hypot(b['x'+kb]-ax,b['y'+kb]-ay)<.6){bd=d;best={a,ka,b,kb,x:ax,y:ay};break}}}
  return best;
}
function applyCorner(c){
  const {a,ka,b,kb}=c, oa=ka==='1'?'2':'1', ob=kb==='1'?'2':'1';
  const la=Math.hypot(a['x'+oa]-c.x,a['y'+oa]-c.y), lb=Math.hypot(b['x'+ob]-c.x,b['y'+ob]-c.y);
  const u1=[(a['x'+oa]-c.x)/la,(a['y'+oa]-c.y)/la], u2=[(b['x'+ob]-c.x)/lb,(b['y'+ob]-c.y)/lb];
  const th=Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1])));
  if(th<.02||th>Math.PI-.02){toast('まっすぐにつながった所は加工できません');return}
  const size=fillet.size*PXMM(), t=fillet.mode==='R'?size/Math.tan(th/2):size;
  if(t>=la-.5||t>=lb-.5){toast(`線が短すぎて ${fillet.mode}${fmt(fillet.size)} にできません。大きさを小さくしてください`);return}
  const T1=[c.x+u1[0]*t,c.y+u1[1]*t], T2=[c.x+u2[0]*t,c.y+u2[1]*t];
  mutate(()=>{
    a['x'+ka]=T1[0];a['y'+ka]=T1[1];b['x'+kb]=T2[0];b['y'+kb]=T2[1];
    let it;
    if(fillet.mode==='R'){
      it=newArc(T1[0],T1[1]); it.x2=T2[0]; it.y2=T2[1];
      const dx=T2[0]-T1[0], dy=T2[1]-T1[1], cl=Math.hypot(dx,dy), n=[-dy/cl,dx/cl];
      const w=[c.x-(T1[0]+T2[0])/2,c.y-(T1[1]+T2[1])/2], sag=size*(1-Math.cos((Math.PI-th)/2));
      it.b=(w[0]*n[0]+w[1]*n[1]>=0?1:-1)*sag;
    }else it=newLine(T1[0],T1[1],T2[0],T2[1]);
    Object.assign(it,{stroke:a.stroke,sw:a.sw,dash:a.dash});
    doc.items.push(it);
  });
}

/* 連続線：クリックごとに点を打ち、次の線が前の線の端から伸びる */
let measure=null;
function setMeasure(it){const dx=it.x2-it.x1, dy=it.y2-it.y1;measure={x:it.x2,y:it.y2,txt:`${mmOf(Math.hypot(dx,dy))} mm ／ ${fmt(-Math.atan2(dy,dx)*180/Math.PI)}°`}}
function angSnap(ox,oy,q,e){
  if(e.altKey) return q;

  const a=Math.atan2(dy,dx), st=e.shiftKey?Math.PI/4:Math.PI/12, t=Math.round(a/st)*st;
  const tol=e.shiftKey?Math.PI:(Math.abs(Math.sin(2*t))<1e-6?6:4)*Math.PI/180;

  if(Math.abs(Math.cos(t))<1e-6) return {x:ox,y:q.y};

}
function startChain(tpl,start){
  const prev=snapStr(), nl=newLine(tpl.x2,tpl.y2,tpl.x2,tpl.y2);

function chainClick(e){

  pushHist(pending.prev); pending=null; measure=null; snapMark=null;
  if(Math.hypot(it.x2-start.x,it.y2-start.y)<.5){render();renderProps();toast('形を閉じました');return}

}
function finishPending(){const {prev}=pending; pending=null; snapMark=null; measure=null; pushHist(prev); render(); renderProps()}
function cancelPending(){const {it}=pending; pending=null; snapMark=null; measure=null; doc.items=doc.items.filter(i=>i!==it); sel=[]; render(); renderProps()}
function autoLeaderText(it){
  for(const s of doc.items){if(s.type!=='shape'||!['ellipse','hole'].includes(s.kind)) continue;
    const rx=s.w/2, ry=s.h/2, k=Math.hypot((it.x1-s.x-rx)/rx,(it.y1-s.y-ry)/ry);
    if(Math.abs(k-1)<.12+6/Math.min(rx,ry)){it.text=(Math.abs(s.w-s.h)<1?'Ø':'')+mmOf(s.w);return}}

function hoverSnap(e){

svg.addEventListener('pointerleave',()=>{if(!drag&&snapMark){snapMark=null;renderOverlay()}});
svg.addEventListener('pointermove',e=>{

  if(drag.mode==='pan'){view.x=drag.vx-(e.clientX-drag.sx)/view.z;view.y=drag.vy-(e.clientY-drag.sy)/view.z;renderView();return}
  const p=toWorld(e);

    <div class="f"><span class="lb">図面の描き方</span><ul class="tips">

function setProp(k,v,live){
  mutate(()=>{for(const it of selItems()){
    if(k==='fill'&&it.type!=='shape') continue;
    if(k==='sw'&&!SWT.includes(it.type)) continue;
    if(k==='dash'&&!DASHT.includes(it.type)) continue;
    if(k==='text'&&(it.type==='dim'||it.type==='angle')){it.text=v;it.auto=!String(v).trim();continue}
    if(k==='lenmm'){if(it.type!=='line'||!(v>0))continue;const a=Math.atan2(it.y2-it.y1,it.x2-it.x1),L=v*PXMM();it.x2=r1(it.x1+Math.cos(a)*L);it.y2=r1(it.y1+Math.sin(a)*L);continue}
    if(k==='angdeg'){if(it.type!=='line')continue;const L=Math.hypot(it.x2-it.x1,it.y2-it.y1),a=-v*Math.PI/180;it.x2=r1(it.x1+Math.cos(a)*L);it.y2=r1(it.y1+Math.sin(a)*L);continue}
    if(k==='rmm'){if(it.type!=='arc'||!(v>0))continue;const g=arcGeom(it),r=Math.max(v*PXMM(),g.c/2);it.b=(it.b<0?-1:1)*(r-Math.sqrt(Math.max(0,r*r-g.c*g.c/4)));continue}
    if(k==='wmm'||k==='hmm'){if(!isBox(it)||!(v>0))continue;it[k[0]]=v*PXMM();continue}
    if(k==='ins'){it.text=v+(it.text||'');continue}
    if(k==='stroke'&&it.type==='image') continue;
    if(k==='arrows'){it.a1=v[0]==='1';it.a2=v[1]==='1';continue}
    it[k]=v;
  }},live?k:'');
}
props.addEventListener('click',e=>{

    renderProps(); return;
  }
  if(a==='front') mutate(()=>{const s=selItems();doc.items=doc.items.filter(i=>!s.includes(i)).concat(s)});
  if(a==='back') mutate(()=>{const s=selItems();doc.items=s.concat(doc.items.filter(i=>!s.includes(i)))});

props.addEventListener('input',e=>{

function shiftItem(it,o,dx,dy){
  if('x1' in o){it.x1=o.x1+dx;it.y1=o.y1+dy;it.x2=o.x2+dx;it.y2=o.y2+dy;if('cx' in o){it.cx=o.cx+dx;it.cy=o.cy+dy}}
  else if(it.type==='pen') it.pts=o.pts.map(q=>[r1(q[0]+dx),r1(q[1]+dy)]);
  else{it.x=o.x+dx;it.y=o.y+dy}
}
function offsetItem(it,d){shiftItem(it,{...it},d,d);return it}
function duplicate(){const s=selItems();if(!s.length)return;const c=s.map(i=>offsetItem({...JSON.parse(JSON.stringify(i)),id:nid()},20));mutate(()=>doc.items.push(...c));sel=c.map(i=>i.id);render();renderProps()}
function removeSel(){if(!sel.length)return;mutate(()=>{doc.items=doc.items.filter(i=>!sel.includes(i.id))});sel=[];render();renderProps()}
function nudge(dx,dy){mutate(()=>{for(const it of selItems()) shiftItem(it,{...it},dx,dy)},'nudge')}
window.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')||!$('#modal').hidden) return;
  const k=e.key.toLowerCase(), mod=e.ctrlKey||e.metaKey;
  if(e.code==='Space'){if(!spaceDown){spaceDown=true;stage.classList.add('panning')}e.preventDefault();return}
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k==='y'){e.preventDefault();redo();return}
  if(mod&&k==='c'){if(sel.length){clip=JSON.stringify(selItems());toast(sel.length+'個をコピーしました')}return}
  if(mod&&k==='d'){e.preventDefault();duplicate();return}
  if(mod&&k==='a'){e.preventDefault();sel=doc.items.map(i=>i.id);renderOverlay();renderProps();return}
  if(mod&&k==='s'){e.preventDefault();saveProject();return}
  if(mod&&k==='p'){e.preventDefault();openPrint();return}
  if(mod) return;
  if(k==='delete'||k==='backspace'){e.preventDefault();removeSel();return}
  if(k==='escape'){if(pending){cancelPending();return}sel=[];setTool('select');renderOverlay();renderProps();return}
  if(k==='enter'&&pending&&pending.chain){cancelPending();return}
  if(k==='enter'&&sel.length===1){const it=byId(sel[0]);if(it&&it.type!=='pen'&&it.type!=='image'){e.preventDefault();openEditor(it)}return}
  const arrows={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]};
  if(arrows[k]&&sel.length){e.preventDefault();const m=e.shiftKey?10:1;nudge(arrows[k][0]*m,arrows[k][1]*m);return}
  const t=TOOLS.find(x=>x[2]===k); if(t) setTool(t[0]);
});
window.addEventListener('keyup',e=>{if(e.code==='Space'){spaceDown=false;stage.classList.toggle('panning',tool==='hand')}});
window.addEventListener('paste',e=>{
  if(e.target.closest('input,textarea')) return;
  const f=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));
  if(f){e.preventDefault();addImageFile(f.getAsFile());return}
  if(clip){e.preventDefault();const c=JSON.parse(clip).map(i=>offsetItem({...i,id:nid()},20));clip=JSON.stringify(c);mutate(()=>doc.items.push(...c));sel=c.map(i=>i.id);render();renderProps()}
});

function buildSVG(scale){
  sel.length&&(overlay.innerHTML='');
  const b=content.getBBox(); renderOverlay();
  if(!b.width&&!b.height) return null;
  const pad=24, x=Math.floor(b.x-pad), y=Math.floor(b.y-pad), w=Math.ceil(b.width+pad*2), h=Math.ceil(b.height+pad*2);
  const c=content.cloneNode(true); c.removeAttribute('id'); c.querySelectorAll('.hit').forEach(n=>n.remove());
  const inner=new XMLSerializer().serializeToString(c);
  const str=`<svg xmlns="http://www.w3.org/2000/svg" width="${w*scale}" height="${h*scale}" viewBox="${x} ${y} ${w} ${h}"><defs>${ROUGH}</defs><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#ffffff"/>${inner}</svg>`;
  return {str,w,h};
}
async function toCanvas(scale=2){
  const s=buildSVG(scale); if(!s) throw new Error('empty');
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s.str)});
  const cv=document.createElement('canvas'); cv.width=s.w*scale; cv.height=s.h*scale;
  const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0,cv.width,cv.height);
  return cv;
}
const toBlob=cv=>new Promise(r=>cv.toBlob(r,'image/png'));
let dlNs;

    if(!dlNs) return false;

  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}

/* ---------- 印刷 ---------- */
const PAPERS={A4:[297,210],A3:[420,297]};
const printOpt={paper:'A4',orient:'auto',fit:'fit'};
let printPng=null;
function printLayout(){
  const b=buildSVG(1); if(!b) return null;
  let [pw,ph]=PAPERS[printOpt.paper];
  const land=printOpt.orient==='auto'?b.w>=b.h:printOpt.orient==='land';
  if(!land)[pw,ph]=[ph,pw];
  const aw=pw-20, ah=ph-20, k=printOpt.fit==='fit'?Math.min(aw/b.w,ah/b.h):1/PXMM();
  const wmm=b.w*k, hmm=b.h*k;
  return {b,pw,ph,land,wmm,hmm,pct:fmt(k*PXMM()*100),over:wmm>aw+.5||hmm>ah+.5};
}
async function openPrint(){
  if(!doc.items.length){toast('図がまだありません');return}

  drawPrint();
}

    <p>${printOpt.paper}${L.land?'横':'縦'}・原寸の ${L.pct}% で印刷します。${L.over?'<b style="color:#e03131">図が用紙からはみ出します。用紙を大きくするか「用紙に合わせる」にしてください。</b>':''}${framed?'<br>この画面からは印刷画面を開けないため、PDF を保存してから開いて印刷してください（ダブルクリックで開く版なら直接印刷できます）。':''}</p>
    <div class="row"><button class="btn" data-x="close">閉じる</button><button class="btn ${framed?'primary':''}" data-x="pdf">PDFで保存</button>${framed?'':'<button class="btn primary" data-x="print">印刷する</button>'}</div>`);

function doPrint(L){

  catch(e){toast('PDFを作る部品を読み込めませんでした。インターネット接続を確認してください');return}
  const sc=Math.min(4,Math.max(1,(L.wmm/25.4*200)/L.b.w)), cv=await toCanvas(sc);
  const pdf=new window.jspdf.jsPDF({orientation:L.land?'landscape':'portrait',unit:'mm',format:printOpt.paper.toLowerCase()});
  pdf.addImage(cv.toDataURL('image/png'),'PNG',(L.pw-L.wmm)/2,10,L.wmm,L.hmm);
  savedMsg(await download(`ポンチ絵-${stamp()}.pdf`,pdf.output('blob')),'PDF を保存しました。開いて印刷してください');
}
$('#bPrint').onclick=openPrint;

async function saveProject(){
  const data=JSON.stringify({app:'ponchie',v:1,mm:doc.mm,items:doc.items},null,0);
  const r=await download(`ポンチ絵-${stamp()}.json`,new Blob([data],{type:'application/json'}));
  if(r){toast('保存しました。「開く」で読み込めます');return}
  if(r===null){toast('保存をやめました');return}
  {openModal(`<h2>図を保存</h2><p>この画面ではファイルを直接保存できないことがあります。下の内容をコピーしてメモ帳などに貼り、拡張子 .json で保存してください。「開く」で読み込めます。</p><textarea id="jsonOut" readonly></textarea><div class="row"><button class="btn" data-x="close">閉じる</button><button class="btn primary" data-x="copy">内容をコピー</button></div>`);
    $('#jsonOut').value=data;
    $('#dlg').onclick=async e=>{const x=e.target.closest('[data-x]')?.dataset.x;if(!x)return;
      if(x==='close')closeModal();
      if(x==='copy'){try{await navigator.clipboard.writeText(data);toast('コピーしました')}catch(err){$('#jsonOut').select();toast('選択しました。Ctrl+C でコピーしてください')}}};
  }
}
function loadFile(f){
  if(f.type.startsWith('image/')){addImageFile(f);return}
  const fr=new FileReader(); fr.onload=()=>{try{const d=JSON.parse(fr.result); if(!Array.isArray(d.items)) throw 0;
    if(d.mm>0) doc.mm=d.mm; mutate(()=>{doc.items=d.items}); sel=[]; renderProps(); requestAnimationFrame(fit); toast('図を開きました')}catch(e){toast('このファイルは読み込めません。ポンチ絵工房で保存した .json を選んでください')}};
  fr.readAsText(f);
}
$('#bSave').onclick=saveProject;
$('#bOpen').onclick=()=>$('#fileIn').click();
$('#bPhoto').onclick=()=>$('#photoIn').click();
$('#fileIn').onchange=e=>{const f=e.target.files[0];if(f)loadFile(f);e.target.value=''};
$('#photoIn').onchange=e=>{const f=e.target.files[0];if(f)addImageFile(f);e.target.value=''};
$('#bNew').onclick=()=>{
  openModal(`<h2>新しい図</h2><p>いまの図は消えます（「戻す」で取り戻せます）。残したいときは先に「保存」してください。</p><div class="row"><button class="btn" data-x="close">やめる</button><button class="btn" data-x="s1">見本：ライン改善案</button><button class="btn" data-x="s2">見本：部品図</button><button class="btn warn" data-x="ok">白紙で始める</button></div>`);
  $('#dlg').onclick=e=>{const x=e.target.closest('[data-x]')?.dataset.x;if(!x)return;closeModal();if(x==='close')return;
    if(x==='s2') doc.mm=2;
    mutate(()=>{doc.items=x==='s1'?sample():x==='s2'?samplePart():[]});sel=[];renderProps();
    if(x==='ok'){view={x:-40,y:-40,z:1};renderView()}else requestAnimationFrame(fit)};
};
$('#bUndo').onclick=undo; $('#bRedo').onclick=redo;
$('#bZoomIn').onclick=()=>zoomAt(1.25); $('#bZoomOut').onclick=()=>zoomAt(.8); $('#bFit').onclick=fit;
$('#cSnap').onchange=e=>{doc.snap=e.target.checked;queueSave()};
$('#cRough').onchange=e=>{doc.rough=e.target.checked;render()};
function openModal(h){$('#dlg').innerHTML=h;$('#modal').hidden=false;setTimeout(()=>$('#dlg').querySelector('.primary,.warn,button')?.focus(),0)}
function closeModal(){$('#modal').hidden=true;$('#dlg').onclick=null}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
let toastT=0; function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}

/* ---------- 見本 ---------- */
function sample(){
  const S=(k,x,y,o={})=>Object.assign(newShape(k,x,y),o), T=(x,y,t,o={})=>Object.assign(newText(x,y,t),o), L=(a,b,c,d,o={})=>Object.assign(newLine(a,b,c,d),o);
  return [
    T(40,20,'第2ライン 自動化改善案（見本）',{size:26,bold:true}),
    T(40,60,'現状：プレスへの投入を手作業 → 改善：ロボットで自動投入',{size:14,stroke:'#5b6876'}),
    S('conveyor',40,210,{text:'搬入コンベア'}),
    S('box',70,184,{w:40,h:36}), S('box',150,184,{w:40,h:36}),
    S('sensor',220,130,{w:72,h:48,lp:'t',text:'在荷センサ',size:12}),
    S('robot',330,130,{fill:'#d0ebff',text:'6軸ロボット'}),
    S('press',500,120,{text:'200t プレス'}),
    S('worker',690,140,{text:'外観検査'}),
    S('num',316,112,{text:'1'}), S('num',486,102,{text:'2'}), S('num',676,122,{text:'3'}),
    L(40,330,300,330,{dim:true,a1:true,a2:true,sw:1.5,text:'2600'}),
    L(60,380,750,380,{a2:true,stroke:'#e03131',sw:3,text:'ワークの流れ',size:14}),
    S('callout',540,6,{w:170,h:86,text:'サイクルタイム\n45秒 → 28秒',bold:true}),
    S('cloud',770,30,{text:'目視検査の\nばらつき'}),
  ];
}

function samplePart(){
  const K=5, X=v=>100+v*K, Y=v=>200+v*K;
  const L=(a,b,c,d,o={})=>Object.assign(newLine(X(a),Y(b),X(c),Y(d)),{stroke:INK,sw:3},o);
  const D=(a,b,c,d,mode,off)=>Object.assign(newDim(X(a),Y(b),X(c),Y(d)),{mode,off:off*K});
  const Ld=(a,b,c,d,t)=>Object.assign(newLeader(X(a),Y(b)),{x2:X(c),y2:Y(d),text:t});
  const pts=[[0,10],[10,0],[85,0],[100,15],[100,40],null,[90,50],[58,50],[50,42],[42,50],[5,50],[5,35],[0,35],[0,10]];
  const items=[Object.assign(newText(X(0),Y(-46),'部品図（見本）　材質：SS400　単位：mm'),{size:16,bold:true,stroke:INK})];
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];if(a&&b) items.push(L(a[0],a[1],b[0],b[1]))}
  items.push(Object.assign(newArc(X(100),Y(40)),{x2:X(90),y2:Y(50),stroke:INK,sw:3,b:-Math.hypot(10,10)*K*(Math.SQRT2-1)/2}));
  for(const cx of [25,75]) items.push(Object.assign(newShape('hole',X(cx)-50,Y(22)-50),{stroke:INK,sw:2,fill:'none'}));
  items.push(L(-6,22,106,22,{sw:1,dash:'center'}));
  items.push(D(0,10,100,15,'h',-34), D(0,10,25,22,'h',-24), D(25,22,75,22,'h',-36), D(10,0,5,50,'v',24));
  items.push(Object.assign(newAngle(X(50),Y(42)),{x1:X(42),y1:Y(50),x2:X(58),y2:Y(50),r:12*K}));
  items.push(Ld(25+7.07,22-7.07,40,8,'2-Ø20'), Ld(5,5,-4,-6,'C10'), Ld(90+7.07,40+7.07,108,40,'R10'));
  return items;
}

/* ---------- 起動 ---------- */
try{const s=JSON.parse(localStorage.getItem('ponchie-doc')||'null');if(s&&Array.isArray(s.items)){doc.items=s.items;doc.snap=s.snap!==false;doc.rough=!!s.rough;if(s.mm>0)doc.mm=s.mm}}catch(e){}
if(!doc.items.length) doc.items=sample();
$('#cSnap').checked=doc.snap; $('#cRough').checked=doc.rough;
setTool('select'); renderProps(); render();
requestAnimationFrame(fit);
new ResizeObserver(()=>{renderView();renderOverlay()}).observe(stage);
})();
</script>
